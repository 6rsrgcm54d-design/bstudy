<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="pencilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background rounded app icon -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)"/>

  <!-- Bible Book shape -->
  <g filter="url(#shadow)">
    <!-- Bible Base -->
    <path d="M110 140 C110 120 125 110 145 110 L256 130 L367 110 C387 110 402 120 402 140 L402 360 C402 380 387 390 367 390 L256 370 L145 390 C125 390 110 380 110 360 Z" fill="#ffffff" fill-opacity="0.95"/>
    <!-- Bible Spine / Center crease -->
    <line x1="256" y1="130" x2="256" y2="370" stroke="#cbd5e1" stroke-width="4"/>
    
    <!-- Left page lines (Bible text indication) -->
    <line x1="140" y1="160" x2="235" y2="168" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="140" y1="195" x2="230" y2="202" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="140" y1="230" x2="235" y2="236" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="140" y1="265" x2="225" y2="270" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="140" y1="300" x2="235" y2="304" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>
    <line x1="140" y1="335" x2="210" y2="338" stroke="#94a3b8" stroke-width="5" stroke-linecap="round"/>

    <!-- Right page: Notes paper lines -->
    <line x1="277" y1="168" x2="372" y2="160" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="2 4"/>
    <line x1="277" y1="202" x2="372" y2="195" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="2 4"/>
    <line x1="277" y1="236" x2="372" y2="230" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="2 4"/>
    <line x1="277" y1="270" x2="372" y2="265" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="2 4"/>
    <line x1="277" y1="304" x2="372" y2="300" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="2 4"/>
    <line x1="277" y1="338" x2="372" y2="335" stroke="#cbd5e1" stroke-width="3" stroke-dasharray="2 4"/>

    <!-- Gold Cross on left -->
    <path d="M185 140 L195 140 L195 170 L205 170 L205 178 L195 178 L195 205 L185 205 L185 178 L175 178 L175 170 L185 170 Z" fill="url(#goldGrad)" opacity="0.9"/>

    <!-- Apple Pencil crossing right side -->
    <g transform="translate(325, 260) rotate(-35)">
      <!-- Pencil Body -->
      <rect x="-10" y="-120" width="20" height="150" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
      <rect x="-6" y="-120" width="12" height="150" fill="#f8fafc"/>
      <!-- Tip cone -->
      <polygon points="-10,30 10,30 0,65" fill="#f1f5f9"/>
      <!-- Nib -->
      <polygon points="-3,55 3,55 0,68" fill="#334155"/>
      <!-- Top band / Apple Pencil cap -->
      <rect x="-10" y="-120" width="20" height="12" rx="2" fill="#cbd5e1"/>
    </g>
  </g>
</svg>
